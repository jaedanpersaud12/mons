name: Game

# Every push that touches the game: check the splat budget, render the fixed still frames
# and compare them with the references, then export the Windows build.
# Put [stills] in a commit message to accept the new pictures as the references.

on:
  push:
    paths: ["game/**", ".github/workflows/game.yml"]
  pull_request:
    paths: ["game/**"]
  workflow_dispatch:

concurrency:
  group: game-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: 4.6-stable
  GODOT_TEMPLATES: 4.6.stable

jobs:
  check-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    defaults:
      run:
        working-directory: game
    steps:
      - uses: actions/checkout@v4

      - name: Cache Godot and the Windows export template
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: ~/godot
          key: godot-${{ env.GODOT_VERSION }}-win-v1

      - name: Download Godot
        if: steps.godot-cache.outputs.cache-hit != 'true'
        working-directory: ${{ runner.temp }}
        run: |
          base=https://github.com/godotengine/godot/releases/download/$GODOT_VERSION
          mkdir -p ~/godot/templates
          curl -fsSL -o godot.zip $base/Godot_v${GODOT_VERSION}_linux.x86_64.zip
          unzip -q godot.zip && mv Godot_v${GODOT_VERSION}_linux.x86_64 ~/godot/godot
          curl -fsSL -o templates.tpz $base/Godot_v${GODOT_VERSION}_export_templates.tpz
          unzip -q -j templates.tpz templates/windows_release_x86_64.exe templates/version.txt -d ~/godot/templates

      - name: Install Godot
        run: |
          chmod +x ~/godot/godot
          echo "GODOT=$HOME/godot/godot" >> $GITHUB_ENV
          mkdir -p ~/.local/share/godot/export_templates
          ln -sfn ~/godot/templates ~/.local/share/godot/export_templates/$GODOT_TEMPLATES
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb libgl1-mesa-dri > /dev/null
          pip install -q numpy pillow

      - name: Splat budget
        run: python3 tools/budget.py

      - name: Import the project
        run: $GODOT --headless --import --path . 2>&1 | tail -5

      - name: Accept new stills
        if: contains(github.event.head_commit.message, '[stills]')
        run: |
          python3 tools/stills.py --update
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/stills
          git diff --cached --quiet || (git commit -m "Update reference stills [skip ci]" && git push)

      - name: Still-frame check
        if: "!contains(github.event.head_commit.message, '[stills]')"
        run: python3 tools/stills.py

      - name: Upload the still-frame report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stills-report
          path: |
            game/build/stills
            game/tests/stills
          retention-days: 14

      - name: Export the Windows build
        run: |
          mkdir -p build/windows
          $GODOT --headless --path . --export-release "Windows Desktop" build/windows/Mons.exe 2>&1 | tail -15
          test -s build/windows/Mons.exe
          ls -lh build/windows

      - name: Upload the Windows build
        uses: actions/upload-artifact@v4
        with:
          name: Mons-windows-${{ github.sha }}
          path: game/build/windows
          retention-days: 14
          compression-level: 1
